services:
  - type: web
    name: arsyx-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: arsyx0web@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_FROM
        value: arsyx0web@gmail.com
      - key: CONTACT_TO
        value: arsyx0web@gmail.com
      - key: ALLOWED_ORIGIN
        sync: false

  - type: web
    name: arsyx-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://arsyx-api.onrender.com/api/*
